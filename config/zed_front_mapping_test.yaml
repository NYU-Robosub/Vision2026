/**:
  ros__parameters:
    use_sim_time: false

    svo:
      use_svo_timestamps: true
      publish_svo_clock: false
      svo_loop: false
      svo_realtime: true

    general:
      camera_name: zed_front
      camera_model: zed2i
      serial_number: 36534008
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0

    video:
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    depth:
      depth_mode: NEURAL_LIGHT
      depth_stabilization: -1
      depth_confidence: 95
      publish_depth_map: true
      publish_depth_info: false
      publish_point_cloud: true
      point_cloud_freq: 10.0
      point_cloud_res: REDUCED

    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_1
      imu_fusion: true
      publish_tf: true
      publish_map_tf: true
      map_frame: map
      odometry_frame: odom
      area_memory: true
      area_file_path: maps/area_memory/front.area
      enable_localization_only: false
      save_area_memory_on_closing: true
      reset_odom_with_loop_closure: true
      set_gravity_as_origin: true
      publish_odom_pose: true
      publish_pose_cov: true
      publish_cam_path: true
      path_pub_rate: 2.0
      path_max_count: 10000

    mapping:
      mapping_enabled: true
      resolution: 0.05
      max_mapping_range: 5.0
      fused_pointcloud_freq: 1.0

    sensors:
      publish_imu_tf: false
      publish_imu: false
      publish_imu_raw: false
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    object_detection:
      od_enabled: false
