/**:
  ros__parameters:
    debug:
      use_pub_timestamps: false  # Preserve shared acquisition stamps for exact sync.

    svo:
      use_svo_timestamps: true
      svo_loop: false
      svo_realtime: true

    general:
      grab_resolution: HD720
      grab_frame_rate: 30
      pub_resolution: CUSTOM
      pub_downscale_factor: 2.0

    video:
      publish_rgb: true
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    depth:
      depth_mode: NEURAL_LIGHT
      depth_stabilization: -1
      depth_confidence: 95
      depth_texture_conf: 100
      publish_depth_map: true
      publish_depth_info: false  # RGB camera_info accompanies rectified RGB.
      publish_point_cloud: true  # Optional RViz comparison; not RTAB-Map's input.
      point_cloud_freq: 5.0
      point_cloud_res: REDUCED

    pos_tracking:
      pos_tracking_enabled: true
      pos_tracking_mode: GEN_1
      imu_fusion: true
      publish_tf: true
      publish_map_tf: false
      map_frame: map
      odometry_frame: odom
      area_memory: false
      area_file_path: ''
      save_area_memory_on_closing: false
      enable_localization_only: false
      reset_odom_with_loop_closure: false
      set_gravity_as_origin: true
      publish_odom_pose: true
      publish_pose_cov: false
      publish_cam_path: true
      path_pub_rate: 2.0
      path_max_count: 10000

    mapping:
      mapping_enabled: false

    sensors:
      publish_imu_tf: false
      publish_imu: false
      publish_imu_raw: false
      publish_cam_imu_transf: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    object_detection:
      od_enabled: false
